name: Build Smey Auto Caption APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/khmer/smey/autocaption
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmeyAutoCaption"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "khmer.smey.autocaption"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "khmer.smey.autocaption"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.2"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

          # Use the exact Smey AI Dubbing logo already uploaded to the GitHub repo root.
          if [ -f smey_ai_dubbing_logo.png ]; then
            cp smey_ai_dubbing_logo.png app/src/main/res/drawable/smey_ai_dubbing_logo.png
          else
            echo "smey_ai_dubbing_logo.png not found in repo root"
            exit 1
          fi

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/smey_ai_dubbing_logo"
                  android:roundIcon="@drawable/smey_ai_dubbing_logo"
                  android:label="🇰🇭 Smey Auto Caption"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SmeyAutoCaption"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.SmeyAutoCaption"
                  parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#080C14</item>
                  <item name="android:navigationBarColor">#080C14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/khmer/smey/autocaption/MainActivity.kt <<'EOF'
          package khmer.smey.autocaption

          import android.Manifest
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import java.io.File
          import java.io.FileOutputStream
          import android.util.Base64

          class MainActivity : Activity() {

              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var pendingFileName: String = "Smey_AI_Dubbing.mp4"
              private var pendingMime: String = "video/mp4"
              private var pendingBlobData: StringBuilder? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = true
                      allowContentAccess = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          installDownloadBridge()
                      }
                  }

                  webView.addJavascriptInterface(AndroidDownloadBridge(), "SmeyDownload")

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          filePath: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = filePath

                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "video/*"
                              putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false)
                          }

                          return try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE)
                              true
                          } catch (e: Exception) {
                              filePathCallback?.onReceiveValue(null)
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  // Normal HTTP/HTTPS downloads.
                  webView.setDownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                      startHttpDownload(url, userAgent, contentDisposition, mimeType)
                  }

                  setContentView(webView)
                  webView.loadUrl("https://khmer-auto-caption-vip1.streamlit.app/")
              }

              private fun installDownloadBridge() {
                  val js = """
                      (function() {
                        if (window.__smeyDownloadV5) return;
                        window.__smeyDownloadV5 = true;

                        function sendAnchor(a) {
                          if (!a) return false;
                          var href = a.href || '';
                          var name = a.getAttribute('download') || 'Smey_AI_Dubbing.mp4';
                          var isBlob = href.indexOf('blob:') === 0;
                          var isData = href.indexOf('data:') === 0;
                          var looksDownload = a.hasAttribute('download') || isBlob || isData;
                          if (!looksDownload) return false;

                          try {
                            if (isBlob) {
                              fetch(href).then(function(r) {
                                var mime = r.headers.get('content-type') || 'video/mp4';
                                return r.blob().then(function(b) {
                                  return new Promise(function(resolve, reject) {
                                    var reader = new FileReader();
                                    reader.onloadend = function() {
                                      try { resolve(String(reader.result).split(',')[1]); }
                                      catch(e) { reject(e); }
                                    };
                                    reader.onerror = reject;
                                    reader.readAsDataURL(b);
                                  }).then(function(b64) {
                                    window.SmeyDownload.startBlob(name, mime, b64);
                                  });
                                });
                              }).catch(function(err) {
                                window.SmeyDownload.error('Download មិនបាន: ' + err);
                              });
                            } else if (isData) {
                              var comma = href.indexOf(',');
                              var meta = href.substring(5, comma);
                              var data = href.substring(comma + 1);
                              var mime = (meta.split(';')[0] || 'video/mp4');
                              window.SmeyDownload.startBlob(name, mime, data);
                            } else {
                              window.SmeyDownload.startUrl(href, name);
                            }
                            return true;
                          } catch(err) {
                            window.SmeyDownload.error('Download មិនបាន: ' + err);
                            return false;
                          }
                        }

                        // Catch normal <a download>, blob: and data: links.
                        document.addEventListener('click', function(e) {
                          var a = e.target && e.target.closest ? e.target.closest('a') : null;
                          if (a && sendAnchor(a)) {
                            e.preventDefault();
                            e.stopImmediatePropagation();
                          }
                        }, true);

                        // Streamlit may create an anchor and call anchor.click() programmatically.
                        var originalAnchorClick = HTMLAnchorElement.prototype.click;
                        HTMLAnchorElement.prototype.click = function() {
                          if (sendAnchor(this)) return;
                          return originalAnchorClick.call(this);
                        };

                        // Watch for dynamically-created download anchors.
                        var observer = new MutationObserver(function() {
                          var links = document.querySelectorAll('a[download], a[href^="blob:"], a[href^="data:"]');
                          for (var i = 0; i < links.length; i++) {
                            if (!links[i].__smeyBound) {
                              links[i].__smeyBound = true;
                              links[i].addEventListener('click', function(e) {
                                if (sendAnchor(this)) {
                                  e.preventDefault();
                                  e.stopImmediatePropagation();
                                }
                              }, true);
                            }
                          }
                        });
                        observer.observe(document.documentElement || document.body, {childList:true, subtree:true});
                      })();
                  """.trimIndent()

                  webView.evaluateJavascript(js, null)
              }

              private fun startHttpDownload(
                  url: String,
                  userAgent: String?,
                  contentDisposition: String?,
                  mimeType: String?
              ) {
                  try {
                      val fileName = URLUtil.guessFileName(
                          url,
                          contentDisposition,
                          mimeType ?: "application/octet-stream"
                      )

                      val request = DownloadManager.Request(Uri.parse(url)).apply {
                          setMimeType(mimeType ?: "application/octet-stream")
                          setTitle(fileName)
                          setDescription("Smey AI Dubbing")
                          setNotificationVisibility(
                              DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                          )
                          setDestinationInExternalPublicDir(
                              Environment.DIRECTORY_DOWNLOADS,
                              fileName
                          )

                          CookieManager.getInstance().getCookie(url)?.let {
                              addRequestHeader("Cookie", it)
                          }
                          if (!userAgent.isNullOrEmpty()) {
                              addRequestHeader("User-Agent", userAgent)
                          }
                      }

                      val dm = getSystemService(DOWNLOAD_SERVICE) as DownloadManager
                      dm.enqueue(request)

                      Toast.makeText(
                          this,
                          "កំពុងដោនឡូត → Downloads",
                          Toast.LENGTH_SHORT
                      ).show()
                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Download មិនបាន: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              inner class AndroidDownloadBridge {

                  @JavascriptInterface
                  fun startUrl(url: String, name: String) {
                      runOnUiThread {
                          startHttpDownload(url, webView.settings.userAgentString, null, null)
                      }
                  }

                  @JavascriptInterface
                  fun startBlob(name: String, mime: String, base64: String) {
                      pendingFileName = if (name.isBlank()) "Smey_AI_Dubbing.mp4" else name
                      pendingMime = if (mime.isBlank()) "video/mp4" else mime
                      pendingBlobData = StringBuilder(base64)

                      runOnUiThread {
                          try {
                              saveBase64ToDownloads(
                                  pendingFileName,
                                  pendingMime,
                                  pendingBlobData.toString()
                              )
                              pendingBlobData = null
                          } catch (e: Exception) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "រក្សាទុក Download មិនបាន: ${e.message}",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun error(message: String) {
                      runOnUiThread {
                          Toast.makeText(
                              this@MainActivity,
                              message,
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
              }

              private fun saveBase64ToDownloads(
                  fileName: String,
                  mimeType: String,
                  base64: String
              ) {
                  val bytes = Base64.decode(base64, Base64.DEFAULT)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val resolver = contentResolver
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                          put(MediaStore.Downloads.MIME_TYPE, mimeType)
                          put(MediaStore.Downloads.IS_PENDING, 1)
                      }

                      val uri = resolver.insert(
                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          values
                      ) ?: throw IllegalStateException("មិនអាចបង្កើតឯកសារ Downloads")

                      try {
                          resolver.openOutputStream(uri)?.use { it.write(bytes) }
                              ?: throw IllegalStateException("មិនអាចសរសេរ file")
                          values.clear()
                          values.put(MediaStore.Downloads.IS_PENDING, 0)
                          resolver.update(uri, values, null, null)

                          Toast.makeText(
                              this,
                              "ដោនឡូតរួច → Downloads/$fileName",
                              Toast.LENGTH_LONG
                          ).show()
                      } catch (e: Exception) {
                          resolver.delete(uri, null, null)
                          throw e
                      }
                  } else {
                      if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(
                              arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE),
                              STORAGE_PERMISSION_REQUEST
                          )
                          throw IllegalStateException("ត្រូវអនុញ្ញាត Storage")
                      }

                      val dir = Environment.getExternalStoragePublicDirectory(
                          Environment.DIRECTORY_DOWNLOADS
                      )
                      if (!dir.exists()) dir.mkdirs()

                      val file = File(dir, fileName)
                      FileOutputStream(file).use { it.write(bytes) }

                      Toast.makeText(
                          this,
                          "ដោនឡូតរួច → Downloads/$fileName",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      val results =
                          if (resultCode == RESULT_OK && data?.data != null) {
                              arrayOf(data.data!!)
                          } else {
                              null
                          }

                      filePathCallback?.onReceiveValue(results)
                      filePathCallback = null
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }

              companion object {
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
                  private const val STORAGE_PERMISSION_REQUEST = 1002
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmeyAutoCaption-APK-ICON-DOWNLOAD-FIXED-v4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
