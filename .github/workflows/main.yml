name: Build បកប្រែរឿងចិន
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/khmer/smey/autocaption
          mkdir -p app/src/main/res/values
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmeyAutoCaption"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "khmer.smey.autocaption"
              compileSdk = 35
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {
                  applicationId = "khmer.smey.autocaption"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="🇰🇭 Smey Auto Caption"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SmeyAutoCaption"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.SmeyAutoCaption"
                  parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#080C14</item>
                  <item name="android:navigationBarColor">#080C14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/java/khmer/smey/autocaption/MainActivity.kt <<'EOF'
          package khmer.smey.autocaption
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          class MainActivity : Activity() {

              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = true
                      allowContentAccess = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }

                  webView.webViewClient = WebViewClient()

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          filePath: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = filePath

                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "video/*"
                              putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false)
                          }

                          return try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE)
                              true
                          } catch (e: Exception) {
                              filePathCallback?.onReceiveValue(null)
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  setContentView(webView)

                  webView.loadUrl(
                      "https://khmer-auto-caption-vip1.streamlit.app/"
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      val results = if (resultCode == RESULT_OK && data?.data != null) {
                          arrayOf(data.data!!)
                      } else {
                          null
                      }

                      filePathCallback?.onReceiveValue(results)
                      filePathCallback = null
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              companion object {
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmeyAutoCaption-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
